<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>LWA forms fixture</title></head>
<body>
  <h1>LWA forms fixture</h1>
  <form onsubmit="return false">
    <input id="pw" type="password" value="" placeholder="password">
    <input id="cc" type="text" autocomplete="cc-number" value="" placeholder="card number">
    <textarea id="public" rows="4" cols="60"></textarea>
    <div id="rich" contenteditable="true" style="border:1px solid #999;min-height:40px;"></div>
    <textarea id="huge" rows="3" cols="60"></textarea>
  </form>
  <script>
    // Battery driver v2: types into fields, CLICKS the first underline rect
    // (from the DOM bridge), reports what it saw to the fixture server.
    if (location.search.indexOf("battery=1") !== -1) {
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const setVal = (el, v) => { el.focus(); el.value = v; el.dispatchEvent(new Event("input", { bubbles: true })); };
      const clickRect0 = (el) => {
        const rects = JSON.parse(el.dataset.lwaRects || "[]");
        if (!rects.length) return null;
        const r = rects[0];
        const ev = new MouseEvent("click", {
          bubbles: true, cancelable: true, view: window,
          clientX: r[0] + r[2] / 2, clientY: r[1] + r[3] / 2
        });
        el.dispatchEvent(ev);
        return rects;
      };
      (async () => {
        try {
        // Handshake, not a timer: wait for the content script to announce its
        // listeners are attached (racing document_idle cost us a run).
        await Promise.race([
          new Promise((res) => document.addEventListener("lwaReady", res, { once: true })),
          sleep(10000)
        ]);
        // public textarea: type, wait for check+overlay, read bridge, click, read result
        setVal(document.getElementById("public"), "Their was a obvious mistake in the report.");
        await sleep(2500);
        const pub = document.getElementById("public");
        const pubRects = pub.dataset.lwaRects || "[]";
        const fieldRect = pub.getBoundingClientRect();
        const rects = clickRect0(pub);
        await sleep(300);
        const publicAfter = pub.value;

        // rich contenteditable: same flow
        const rich = document.getElementById("rich");
        rich.focus(); rich.textContent = "This is a exmaple of rich text.";
        rich.dispatchEvent(new Event("input", { bubbles: true }));
        await sleep(2500);
        const richRects = rich.dataset.lwaRects || "[]";
        const rects2 = clickRect0(rich);
        await sleep(300);
        const richAfter = rich.textContent;

        // privacy regression: password typed AFTER public flows
        const pw = document.getElementById("pw");
        pw.focus(); pw.value = "hunter2-secret";
        pw.dispatchEvent(new Event("input", { bubbles: true }));
        await sleep(1200);

        await fetch("/driver-report", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            publicRects: JSON.parse(pubRects).length,
            richRects: JSON.parse(richRects).length,
            clicked: [!!rects, !!rects2],
            publicFieldRect: [Math.round(fieldRect.x), Math.round(fieldRect.y), Math.round(fieldRect.width), Math.round(fieldRect.height)],
            publicAfter: publicAfter, richAfter: richAfter
          })
        }).catch(function () {});
        } catch (err) {
          // Driver died: report WHY instead of going silent (the rig's rule:
          // silent deaths are evidence bugs).
          await fetch("/driver-report", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ driverError: String(err && err.stack || err) })
          }).catch(function () {});
        }
        await fetch("/battery-done").catch(function () {});
      })();
    }
  </script>
</body>
</html>
